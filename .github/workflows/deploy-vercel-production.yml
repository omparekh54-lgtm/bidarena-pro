name: Deploy BidArena Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bidarena-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_6SL2MJ0RqbyM1rn3BaK1fcEo
  VERCEL_PROJECT_ID: prj_GYX0ENRuIhAooepKT37RszO3xhwZ

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@59.16.0

      - name: Link Vercel project
        shell: bash
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "VERCEL_TOKEN secret is missing" && exit 1)
          rm -rf .vercel
          vercel link --yes --project bidarena-pro-live --scope omparekh54-4085s-projects --token="${{ secrets.VERCEL_TOKEN }}"
          vercel pull --yes --environment=production --scope omparekh54-4085s-projects --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifact
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
