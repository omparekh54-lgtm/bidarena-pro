name: Deploy BidArena Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bidarena-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_6SL2MJ0RqbyM1rn3BaK1fcEo
  VERCEL_PROJECT_ID: prj_GYX0ENRuIhAooepKT37RszO3xhwZ

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Verify Vercel token
        shell: bash
        run: |
          test -n "${{ secrets.VERCEL_TOKEN }}" || (echo "VERCEL_TOKEN secret is missing" && exit 1)

      - name: Deploy production through Vercel REST API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts = { ...pkg.scripts, build: "node bootstrap-source.mjs && next build" };

          const bootstrap = `import { mkdtempSync, writeFileSync, cpSync, readdirSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { execFileSync } from "node:child_process";
          const archiveUrl = "https://codeload.github.com/omparekh54-lgtm/bidarena-pro/tar.gz/refs/heads/main";
          const response = await fetch(archiveUrl);
          if (!response.ok) throw new Error(\`Failed to download GitHub source: \${response.status}\`);
          const bytes = Buffer.from(await response.arrayBuffer());
          const work = mkdtempSync(join(tmpdir(), "bidarena-source-"));
          const archive = join(work, "source.tar.gz");
          const extract = join(work, "repo");
          writeFileSync(archive, bytes);
          execFileSync("mkdir", ["-p", extract]);
          execFileSync("tar", ["-xzf", archive, "--strip-components=1", "-C", extract]);
          for (const name of readdirSync(extract)) {
            if (["package.json","package-lock.json","node_modules",".git"].includes(name)) continue;
            cpSync(join(extract, name), join(process.cwd(), name), { recursive: true, force: true });
          }
          rmSync(work, { recursive: true, force: true });
          console.log("BidArena source synchronized from GitHub main.");`;

          const body = {
            name: "bidarena-pro-live",
            project: "prj_GYX0ENRuIhAooepKT37RszO3xhwZ",
            target: "production",
            files: [
              { file: "package.json", data: JSON.stringify(pkg) },
              { file: "bootstrap-source.mjs", data: bootstrap }
            ],
            gitMetadata: {
              remoteUrl: "https://github.com/omparekh54-lgtm/bidarena-pro",
              commitRef: "main",
              commitSha: process.env.GITHUB_SHA,
              commitMessage: process.env.GITHUB_SHA,
              ci: true,
              ciType: "github-actions"
            }
          };

          const headers = {
            Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
            "Content-Type": "application/json"
          };
          const teamId = "team_6SL2MJ0RqbyM1rn3BaK1fcEo";
          const create = await fetch(`https://api.vercel.com/v13/deployments?teamId=${teamId}`, {
            method: "POST",
            headers,
            body: JSON.stringify(body)
          });
          const deployment = await create.json();
          if (!create.ok) {
            console.error(JSON.stringify(deployment));
            process.exit(1);
          }

          console.log("DEPLOYMENT_ID=" + deployment.id);
          console.log("DEPLOYMENT_URL=https://" + deployment.url);

          const deadline = Date.now() + 12 * 60 * 1000;
          while (Date.now() < deadline) {
            await new Promise((resolve) => setTimeout(resolve, 5000));
            const response = await fetch(`https://api.vercel.com/v13/deployments/${deployment.id}?teamId=${teamId}`, { headers });
            const current = await response.json();
            if (!response.ok) {
              console.error(JSON.stringify(current));
              process.exit(1);
            }
            console.log("VERCEL_STATE=" + current.readyState);
            if (current.readyState === "READY") {
              console.log("PRODUCTION_URL=https://bidarena-pro-live.vercel.app");
              process.exit(0);
            }
            if (["ERROR","CANCELED"].includes(current.readyState)) {
              console.error(JSON.stringify({ id: current.id, state: current.readyState, errorCode: current.errorCode, errorMessage: current.errorMessage }));
              process.exit(1);
            }
          }

          console.error("Deployment timed out waiting for READY state");
          process.exit(1);
          NODE
