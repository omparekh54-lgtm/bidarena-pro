name: Apply tiered auction queue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[auction-tier-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tiered queue and auction badge
        shell: python
        run: |
          from pathlib import Path

          room_path = Path('src/lib/auction/room-engine.ts')
          room = room_path.read_text()
          old_import = 'import { canBid, minimumBasePriceForPool, nextBidAmount, secureShuffle } from "./engine";'
          new_import = 'import { auctionTier, canBid, minimumBasePriceForPool, nextBidAmount, secureShuffle, type AuctionTier } from "./engine";'
          room = room.replace(old_import, new_import)

          start = room.index('function cricketGroup(athlete: Athlete) {') if 'function cricketGroup(athlete: Athlete) {' in room else room.index('function auctionRoleGroup(sport: Sport, athlete: Athlete) {')
          end = room.index('export function createRoomState', start)
          replacement = '''function auctionRoleGroup(sport: Sport, athlete: Athlete) {\n  const role = athlete.role.toLowerCase();\n  const secondary = athlete.secondaryRole?.toLowerCase() ?? "";\n  if (sport === "cricket") {\n    if (role.includes("all-rounder")) return "all-rounder";\n    if (role.includes("bowler")) return role.includes("spin") || secondary.includes("spin") || secondary.includes("orthodox") ? "spinner" : "pacer";\n    if (role.includes("batter") || role.includes("wicketkeeper")) return "batter";\n    return "other";\n  }\n  if (role.includes("goalkeeper") || role.includes("goalie")) return "goalkeeper";\n  if (role.includes("defender") || role.includes("centre-back") || role.includes("full-back") || role.includes("wing-back")) return "defender";\n  if (role.includes("midfielder") || role.includes("midfield")) return "midfielder";\n  if (role.includes("forward") || role.includes("striker") || role.includes("winger") || role.includes("attacker")) return "forward";\n  return "other";\n}\n\nfunction interleaveGroups(groups: Athlete[][]) {\n  const result: Athlete[] = [];\n  const queues = groups.map((group) => [...group]);\n  let added = true;\n  while (added) {\n    added = false;\n    for (const queue of queues) {\n      const athlete = queue.shift();\n      if (athlete) {\n        result.push(athlete);\n        added = true;\n      }\n    }\n  }\n  return result;\n}\n\nfunction orderAthletes(athletes: Athlete[]) {\n  const tierQueues = new Map<AuctionTier, Athlete[]>();\n  for (const tier of [1, 2, 3] as const) {\n    const tierAthletes = secureShuffle(athletes.filter((athlete) => auctionTier(athlete) === tier));\n    const groupNames = [...new Set(tierAthletes.map((athlete) => auctionRoleGroup(athlete.sport, athlete)))];\n    const groups = groupNames.map((group) => secureShuffle(tierAthletes.filter((athlete) => auctionRoleGroup(athlete.sport, athlete) === group)));\n    tierQueues.set(tier, interleaveGroups(groups));\n  }\n  return [1, 2, 3].flatMap((tier) => tierQueues.get(tier as AuctionTier) ?? []);\n}\n\nexport function buildAuctionQueue(sport: Sport, playerPoolMode: PlayerPoolMode = "current") {\n  return orderAthletes(athletesForPool(sport, playerPoolMode)).map((athlete) => athlete.id);\n}\n\n'''
          room = room[:start] + replacement + room[end:]

          old_requeue = '    room.queue = secureShuffle(recyclable);'
          new_requeue = '    room.queue = orderAthletes(recyclable.flatMap((athleteId) => { const athlete = athleteById.get(athleteId); return athlete ? [athlete] : []; })).map((athlete) => athlete.id);'
          room = room.replace(old_requeue, new_requeue)
          room_path.write_text(room)

          ui_path = Path('src/components/auction-arena.tsx')
          ui = ui_path.read_text()
          ui = ui.replace(
              'import { canBid, formatMoney, minimumBasePriceForPool, nextBidAmount } from "@/lib/auction/engine";',
              'import { auctionTier, canBid, formatMoney, minimumBasePriceForPool, nextBidAmount } from "@/lib/auction/engine";'
          )
          ui = ui.replace(
              '  const current = room.currentAthlete;\n  const proposedBid',
              '  const current = room.currentAthlete;\n  const currentTier = current ? auctionTier(current) : null;\n  const proposedBid'
          )
          ui = ui.replace(
              '<Sparkles size={14} /> {current.role} · {current.country}',
              '<Sparkles size={14} /> TIER {currentTier} · {current.role} · {current.country}'
          )
          ui_path.write_text(ui)

      - name: Commit tiered auction update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auction/room-engine.ts src/components/auction-arena.tsx .github/workflows/apply-tiered-auction.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Implement tiered auction ordering [auction-tier-bot]"
          git push
